[pytest]
testpaths = tests BackendEngine/tests
addopts = -ra --cov=ctr_loader --cov=pricing_engine --cov=gap_config --cov=reporting --cov=gap_pricing_gui --cov-report=term-missing
markers =
    unit: fast business-logic tests
    integration: database or external-system tests

[coverage:run]
branch = True

[coverage:report]
fail_under = 95
